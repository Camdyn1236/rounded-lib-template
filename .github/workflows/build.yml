name: Android NDK Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS: "35.0.0"
  PLATFORM: "android-35"

jobs:
  build:
    name: Build Android (${{ matrix.unity_version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            unity_version: "2021.x.x"
            unity_slug: "2021-x-x"

          - abi: arm64-v8a
            unity_version: "2022.x.x"
            unity_slug: "2022-x-x"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f MistyTemp.zip ]]; then
            unzip -q -o MistyTemp.zip
            echo "Unzipped MistyTemp.zip"
          fi

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f gradlew && -d app ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"

          elif [[ -f MistyTemp/gradlew && -d MistyTemp/app ]]; then
            echo "dir=MistyTemp" >> "$GITHUB_OUTPUT"

          else
            echo "Android project not found!" >&2
            echo "Expected gradlew and app/ at root or inside MistyTemp/"
            ls -la
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "platforms;${PLATFORM}"

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Configure local SDK paths
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          printf 'sdk.dir=%s\nndk.dir=%s/ndk/%s\n' \
            "$ANDROID_HOME" \
            "$ANDROID_HOME" \
            "$NDK_VERSION" > local.properties

      - name: Fix CMake arguments placement (AGP 8+)
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/fix_cmake.py <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("app/build.gradle not found")

          text = p.read_text()

          # Remove Unity version arguments from the top-level CMake block.
          text = re.sub(
              r'\n\s*def unityVersion\s*=\s*providers\.gradleProperty\([\'"]unityVersion[\'"]\)'
              r'\.orElse\([\'"]2022\.x\.x[\'"]\)\.get\(\)\s*'
              r'\n\s*arguments\s+"-DMISTYTEMP_UNITY_VERSION=\$\{unityVersion\}"',
              '',
              text
          )

          # Remove any remaining misplaced arguments declaration.
          text = re.sub(
              r'\n\s*arguments\s+"-DMISTYTEMP_UNITY_VERSION=\$\{unityVersion\}"',
              '',
              text
          )

          # Add the Unity version argument inside defaultConfig.
          if "MISTYTEMP_UNITY_VERSION" not in text:
              pattern = r'(defaultConfig\s*\{)'

              replacement = r'''\1
                  externalNativeBuild {
                      cmake {
                          def unityVersion = providers.gradleProperty('unityVersion').orElse('2022.x.x').get()
                          arguments "-DMISTYTEMP_UNITY_VERSION=${unityVersion}"
                      }
                  }
              '''

              text, count = re.subn(pattern, replacement, text, count=1)

              if count == 0:
                  raise SystemExit("Could not locate defaultConfig block")

          p.write_text(text)

          print("Successfully patched app/build.gradle")
          PYTHON

          python3 /tmp/fix_cmake.py

          echo "Updated Gradle configuration:"
          sed -n '1,220p' app/build.gradle

      - name: Build native shared library
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          UNITY_VERSION: ${{ matrix.unity_version }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:externalNativeBuildDebug \
            -Pandroid.injected.build.abi=${{ matrix.abi }} \
            -PunityVersion="${UNITY_VERSION}"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: mistytemp-unity-${{ matrix.unity_slug }}-${{ matrix.abi }}-so
          path: |
            **/app/build/intermediates/cxx/**/obj/${{ matrix.abi }}/*.so
            **/app/build/intermediates/cmake/**/${{ matrix.abi }}/*.so
            **/app/build/intermediates/**/*.so
          if-no-files-found: error
          retention-days: 14
