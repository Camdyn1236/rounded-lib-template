name: MistyTemp Android Build

'on':
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mistytemp-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '26.1.10909125'
  CMAKE_VERSION: '3.22.1'
  BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_PLATFORM: 'android-35'

jobs:
  build:
    name: Unity ${{ matrix.unity_version }} - ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - unity_version: '2021.3'
            abi: 'arm64-v8a'
          - unity_version: '2022.3'
            abi: 'arm64-v8a'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "gradlew" && -d "app" ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f "MistyTemp/gradlew" && -d "MistyTemp/app" ]]; then
            echo "dir=MistyTemp" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Android Gradle project not found."
            find . -maxdepth 5 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Configure Gradle project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          printf 'sdk.dir=%s\nndk.dir=%s/ndk/%s\n' \
            "$ANDROID_HOME" \
            "$ANDROID_HOME" \
            "$NDK_VERSION" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android library
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Unity version: ${{ matrix.unity_version }}"
          echo "ABI: ${{ matrix.abi }}"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug \
            -PunityVersion=${{ matrix.unity_version }} \
            -Pandroid.injected.build.abi=${{ matrix.abi }}

      - name: Locate compiled library
        id: library
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          LIBRARY=$(find "$PROJECT_DIR/app/build" \
            -type f \
            -name "libMistyTemp.so" \
            -path "*${{ matrix.abi }}*" \
            -print -quit)

          if [[ -z "$LIBRARY" ]]; then
            echo "::error::libMistyTemp.so was not generated."
            echo "Available .so files:"
            find "$PROJECT_DIR/app/build" -type f -name "*.so" || true
            exit 1
          fi

          echo "library=$LIBRARY" >> "$GITHUB_OUTPUT"
          echo "Found library: $LIBRARY"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="dist/unity-${{ matrix.unity_version }}/${{ matrix.abi }}"

          mkdir -p "$OUTPUT"

          cp "${{ steps.library.outputs.library }}" "$OUTPUT/libMistyTemp.so"

          cat > "$OUTPUT/build-info.txt" << EOF
          Project: MistyTemp
          Unity Version: ${{ matrix.unity_version }}
          Android ABI: ${{ matrix.abi }}
          NDK Version: ${NDK_VERSION}
          CMake Version: ${CMAKE_VERSION}
          Commit: ${GITHUB_SHA}
          EOF

          ls -lah "$OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MistyTemp-Unity-${{ matrix.unity_version }}-${{ matrix.abi }}
          path: dist/unity-${{ matrix.unity_version }}/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 30
