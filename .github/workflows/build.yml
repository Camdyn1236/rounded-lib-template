name: MistyTemp Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mistytemp-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '26.1.10909125'
  CMAKE_VERSION: '3.22.1'
  BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_PLATFORM: 'android-35'
  # must match the zip sitting at repository root
  SOURCE_ZIP: 'MistyTemp_JupiterX_Bots_Full.zip'

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MistyTemp project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/${SOURCE_ZIP}"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Missing repository-root file: ${SOURCE_ZIP}"
            echo "Files in repository root:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mistytemp-source"
          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/mistytemp-source"
          PROJECT_DIR="$RUNNER_TEMP/mistytemp-source/MistyTemp"
          if [[ ! -f "$PROJECT_DIR/gradlew" || ! -d "$PROJECT_DIR/app" ]]; then
            echo "::error::ZIP layout did not contain MistyTemp/gradlew and MistyTemp/app"
            find "$RUNNER_TEMP/mistytemp-source" -maxdepth 4 -print
            exit 1
          fi
          chmod +x "$PROJECT_DIR/gradlew"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Android SDK paths
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/%s\n' "$ANDROID_HOME" "$ANDROID_HOME" "$NDK_VERSION" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native library
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:externalNativeBuildDebug \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Collect shared libraries
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          OUTPUT_DIR="$GITHUB_WORKSPACE/dist/arm64-v8a"
          mkdir -p "$OUTPUT_DIR"
          find "$PROJECT_DIR/app/build" -type f -name '*.so' -print0 | while IFS= read -r -d '' FILE; do
            cp "$FILE" "$OUTPUT_DIR/"
          done
          if ! find "$OUTPUT_DIR" -type f -name '*.so' -print -quit | grep -q .; then
            echo '::error::No .so files were produced.'
            find "$PROJECT_DIR/app/build" -type f | tail -100
            exit 1
          fi
          printf 'ABI: arm64-v8a\nNDK: %s\nCommit: %s\nSource: %s\n' \
            "$NDK_VERSION" "$GITHUB_SHA" "$SOURCE_ZIP" > "$OUTPUT_DIR/build-info.txt"
          ls -la "$OUTPUT_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MistyTemp-Undetected-Bypass-arm64-v8a
          path: dist/arm64-v8a/
          if-no-files-found: error
          retention-days: 30
