      - name: Extract MistyTemp project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="MistyTemp-Unity-2021.3-2022.3-FIXED.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Missing $ZIP_FILE"
            ls -lah
            exit 1
          fi

          mkdir -p extracted-project

          unzip -oq "$ZIP_FILE" -d extracted-project

          PROJECT_DIR="extracted-project/MistyTemp"

          if [[ ! -f "$PROJECT_DIR/gradlew" ]]; then
            echo "::error::gradlew not found in $PROJECT_DIR"
            find extracted-project -maxdepth 5 -type f
            exit 1
          fi

          if [[ ! -d "$PROJECT_DIR/app" ]]; then
            echo "::error::app folder not found"
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found successfully!"
