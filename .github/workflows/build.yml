name: Android NDK Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS: "35.0.0"
  PLATFORM: "android-35"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            unity_version: "2021.x.x"
            unity_slug: "2021-x-x"
          - abi: arm64-v8a
            unity_version: "2022.x.x"
            unity_slug: "2022-x-x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          set -euo pipefail
          if [[ -f MistyTemp.zip ]]; then
            unzip -q -o MistyTemp.zip
            echo "Unzipped MistyTemp.zip"
          fi

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gradlew && -d app ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f MistyTemp/gradlew && -d MistyTemp/app ]]; then
            echo "dir=MistyTemp" >> "$GITHUB_OUTPUT"
          else
            echo "Android project not found (expected gradlew and app/ at root or in MistyTemp/)" >&2
            ls -la
            exit 1
          fi

      - name: Fix CMake arguments placement (AGP 8+)
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          # Move unityVersion argument from top-level cmake {} into defaultConfig
          # so it works with AGP 8.6
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          text = p.read_text()
          old = """    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
            def unityVersion = providers.gradleProperty('unityVersion').orElse('2022.x.x').get()
            arguments "-DMISTYTEMP_UNITY_VERSION=${unityVersion}"
        }
    }"""
          new = """    defaultConfig {
        externalNativeBuild {
            cmake {
                def unityVersion = providers.gradleProperty('unityVersion').orElse('2022.x.x').get()
                arguments "-DMISTYTEMP_UNITY_VERSION=${unityVersion}"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }"""
          if old not in text:
              # already fixed or different formatting – try a more tolerant replace
              import re
              text2 = re.sub(
                  r"externalNativeBuild\s*\{\s*cmake\s*\{[^}]*arguments\s*\"-DMISTYTEMP_UNITY_VERSION=[^\"]*\"[^}]*\}\s*\}",
                  """defaultConfig {
        externalNativeBuild {
            cmake {
                def unityVersion = providers.gradleProperty('unityVersion').orElse('2022.x.x').get()
                arguments "-DMISTYTEMP_UNITY_VERSION=${unityVersion}"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }""",
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if text2 == text:
                  print("WARNING: could not locate the cmake arguments block to patch")
                  print(text)
              else:
                  p.write_text(text2)
                  print("Patched via regex")
          else:
              p.write_text(text.replace(old, new))
              print("Patched exact match")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android build packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "platforms;${PLATFORM}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Configure local SDK paths
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/%s\n' \
            "$ANDROID_HOME" "$ANDROID_HOME" "$NDK_VERSION" > local.properties

      - name: Build native shared library
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          UNITY_VERSION: ${{ matrix.unity_version }}
        run: ./gradlew --no-daemon :app:externalNativeBuildDebug \
          -Pandroid.injected.build.abi=${{ matrix.abi }} \
          -PunityVersion=${UNITY_VERSION}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: mistytemp-unity-${{ matrix.unity_slug }}-${{ matrix.abi }}-so
          path: |
            **/app/build/intermediates/cxx/**/obj/${{ matrix.abi }}/*.so
            **/app/build/intermediates/cmake/**/${{ matrix.abi }}/*.so
            **/app/build/intermediates/**/*.so
          if-no-files-found: error
