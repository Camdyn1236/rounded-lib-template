name: Android NDK Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS: "35.0.0"
  PLATFORM: "android-35"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            unity_version: "2021.x.x"
            unity_slug: "2021-x-x"
          - abi: arm64-v8a
            unity_version: "2022.x.x"
            unity_slug: "2022-x-x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          set -euo pipefail
          if [[ -f MistyTemp.zip ]]; then
            unzip -q -o MistyTemp.zip
            echo "Unzipped MistyTemp.zip"
          fi

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gradlew && -d app ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f MistyTemp/gradlew && -d MistyTemp/app ]]; then
            echo "dir=MistyTemp" >> "$GITHUB_OUTPUT"
          else
            echo "Android project not found (expected gradlew and app/ at root or in MistyTemp/)" >&2
            ls -la
            exit 1
          fi

      - name: Fix CMake arguments placement (AGP 8+)
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          # AGP 8.x no longer accepts arguments{} on the top-level externalNativeBuild.cmake block.
          # Move it under defaultConfig.
          cat > /tmp/fix_cmake.py << 'EOF'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          text = p.read_text()

          # Remove the bad arguments line from the top-level cmake block
          text = re.sub(
              r'(\s*version\s+[\'"]3\.22\.1[\'"]\s*)\n\s*def unityVersion = providers\.gradleProperty\([\'"]unityVersion[\'"]\)\.orElse\([\'"]2022\.x\.x[\'"]\)\.get\(\)\s*\n\s*arguments\s+"-DMISTYTEMP_UNITY_VERSION=\$\{unityVersion\}"',
              r'\1',
              text,
          )

          # Also handle the case where arguments is present without the def line in between
          text = re.sub(
              r'\n\s*arguments\s+"-DMISTYTEMP_UNITY_VERSION=\$\{unityVersion\}"',
              '',
              text,
          )

          # Inject correct block inside defaultConfig if not already present
          if "MISTYTEMP_UNITY_VERSION" not in text:
              text = text.replace(
                  """    defaultConfig {
          applicationId "com.glitch.HoldableTemplate"
          minSdk 27
          targetSdk 34
          versionCode 1
          versionName "1.0"

          testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
      }""",
                  """    defaultConfig {
          applicationId "com.glitch.HoldableTemplate"
          minSdk 27
          targetSdk 34
          versionCode 1
          versionName "1.0"

          testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

          externalNativeBuild {
              cmake {
                  def unityVersion = providers.gradleProperty('unityVersion').orElse('2022.x.x').get()
                  arguments "-DMISTYTEMP_UNITY_VERSION=${unityVersion}"
              }
          }
      }""",
              )

          p.write_text(text)
          print("Patched app/build.gradle")
          print("---")
          print(p.read_text())
          EOF
          python3 /tmp/fix_cmake.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android build packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "platforms;${PLATFORM}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Configure local SDK paths
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/%s\n' \
            "$ANDROID_HOME" "$ANDROID_HOME" "$NDK_VERSION" > local.properties

      - name: Build native shared library
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          UNITY_VERSION: ${{ matrix.unity_version }}
        run: ./gradlew --no-daemon :app:externalNativeBuildDebug \
          -Pandroid.injected.build.abi=${{ matrix.abi }} \
          -PunityVersion=${UNITY_VERSION}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: mistytemp-unity-${{ matrix.unity_slug }}-${{ matrix.abi }}-so
          path: |
            **/app/build/intermediates/cxx/**/obj/${{ matrix.abi }}/*.so
            **/app/build/intermediates/cmake/**/${{ matrix.abi }}/*.so
            **/app/build/intermediates/**/*.so
          if-no-files-found: error
